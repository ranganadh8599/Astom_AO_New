[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-orchestrator"
version = "0.1.0"
description = "LangGraph orchestration layer in front of LiteLLM and external A2A agents"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Langfuse v4/v5 Python SDK (OpenTelemetry). Tracing degrades to a no-op if the
    # package or the keys are missing.
    "langfuse>=4,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Runs the local test MCP server (examples/mcp_field_ops) used to exercise the MCP leg.
mcp-server = ["mcp>=1.9"]
# Phase 2: conversation memory that survives restarts.
postgres = [
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
]
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `examples` holds the sample A2A agent and MCP server the tests run against.
pythonpath = ["src", "examples", "."]
