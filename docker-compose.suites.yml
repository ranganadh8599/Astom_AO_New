networks:
  default:
  # The network the LiteLLM gateway already created. `external` means compose expects it to
  # exist and will not create or delete it. Verify with: docker network ls
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-litellm-gateway_default}
